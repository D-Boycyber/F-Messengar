<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); width: 100%; max-width: 440px; box-sizing: border-box; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 12px; }
        label { display: block; margin-top: 18px; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; font-size: 15px; }
        input, button { width: 100%; padding: 14px 16px; margin: 0; border: 1px solid #475569; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #0f172a; color: #f8fafc; }
        input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        button { background: #0ea5e9; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 25px; }
        button:hover { background: #0284c7; }
        .error { background: #7f1d1d; color: #fca5a5; padding: 14px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b91c1c; font-weight: 500; }
        a { color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 600; }
        a:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛠️ Admin Control Login</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Admin Passcode:</label>
            <input type="password" name="admin_pass" required>
            <button type="submit">Login to Control Room</button>
        </form>
        <p style="text-align: center; margin-top: 25px;"><a href="/">← Back to Home</a></p>
    </div>
</body>
</html>
