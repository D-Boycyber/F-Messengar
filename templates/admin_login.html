<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #075e54; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #075e54; color: white; font-weight: bold; border: none; cursor: pointer; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛠️ Admin Control Login</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Admin Passcode:</label>
            <input type="password" name="admin_pass" required>
            <button type="submit">Login to Control Room</button>
        </form>
        <p style="text-align: center; margin-top: 15px;"><a href="/" style="color: #075e54; text-decoration: none;">← Back to Home</a></p>
    </div>
</body>
</html>
