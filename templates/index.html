<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure One-Time Messenger</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3); width: 100%; max-width: 600px; box-sizing: border-box; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 26px; margin-bottom: 25px; border-bottom: 2px solid #334155; padding-bottom: 12px; }
        label { display: block; margin-top: 18px; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; font-size: 15px; }
        textarea, input, button { width: 100%; padding: 14px 16px; margin: 0; border: 1px solid #475569; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #0f172a; color: #f8fafc; transition: all 0.2s ease; }
        textarea:focus, input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        textarea { resize: vertical; min-height: 120px; }
        button { background: #0ea5e9; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 25px; font-size: 16px; }
        button:hover { background: #0284c7; }
        .result { background: #0f172a; padding: 20px; border-radius: 8px; margin-top: 25px; word-break: break-all; border: 1px solid #334155; }
        .result p { margin: 8px 0; line-height: 1.5; }
        .result a { color: #38bdf8; word-break: break-all; text-decoration: none; }
        .result a:hover { text-decoration: underline; }
        .error { background: #7f1d1d; color: #fca5a5; padding: 14px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b91c1c; font-weight: 500; }
        .nav-link { display: block; text-align: center; margin-top: 25px; color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 15px; }
        .nav-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Secure One-Time Encryptor</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>Secret Message (Supports letters, numbers & symbols):</label>
            <textarea name="message" placeholder="Type your secure message here..." required></textarea>
            
            <label>Shift Key (Number):</label>
            <input type="number" name="shift" value="3" required>

            <label>Optional Receiver Passcode:</label>
            <input type="text" name="passcode" placeholder="e.g. secret123 (leave blank for none)">
            
            <button type="submit">Create Secure Link</button>
        </form>

        {% if encrypted %}
        <div class="result">
            <p style="color: #94a3b8; font-size: 14px;"><strong>Encrypted Ciphertext:</strong></p>
            <p style="font-family: monospace; background: #1e293b; padding: 10px; border-radius: 6px;">{{ encrypted }}</p>
            
            <p style="color: #94a3b8; font-size: 14px; margin-top: 15px;"><strong>Self-Destruct Link:</strong></p>
            <a href="{{ url_for('view_secret', secret_id=secret_id, _external=True) }}" target="_blank">
                {{ url_for('view_secret', secret_id=secret_id, _external=True) }}
            </a>
        </div>
        {% endif %}

        <a href="/admin" class="nav-link">🛠️ Admin Control Room</a>
    </div>
</body>
</html>
