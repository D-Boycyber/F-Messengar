<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decrypt WhatsApp Message</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; align-items: center; height: 90vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #007bff; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        textarea, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .msg-box { margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 6px; font-size: 18px; font-weight: bold; color: #2c3e50; word-break: break-all; text-align: center; border-left: 5px solid #007bff; }
        .error { color: #d9534f; font-weight: bold; text-align: center; }
        .nav-link { text-align: center; margin-top: 15px; }
        .nav-link a { color: #25d366; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔓 Decrypt Secret Message</h2>
    <form method="POST">
        <label for="ciphertext">Paste Encrypted Text from WhatsApp:</label>
        <textarea name="ciphertext" id="ciphertext" rows="3" placeholder="Paste scrambled text here..." required></textarea>

        <label for="shift">Shift Key:</label>
        <input type="number" name="shift" id="shift" value="3" min="1" max="25" required>

        <button type="submit">Decrypt Message</button>
    </form>

    {% if decrypted_message %}
        <div class="msg-box">
            Original Message:<br>
            <span style="color: #28a745;">{{ decrypted_message }}</span>
        </div>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="nav-link">
        <a href="/">⬅ Back to Encrypter</a>
    </div>
</div>
</body>
</html>
